<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Soft shadow for 3D depth -->
  <rect x="12" y="14" width="76" height="76" rx="20" fill="#e0e0e0" />
  
  <!-- Main dice body -->
  <rect x="10" y="10" width="76" height="76" rx="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="4"/>
  
  <!-- Dice Dots (5) -->
  <circle cx="48" cy="48" r="8" fill="#1a1a1a"/> <!-- Center -->
  <circle cx="28" cy="28" r="8" fill="#1a1a1a"/> <!-- Top Left -->
  <circle cx="68" cy="68" r="8" fill="#1a1a1a"/> <!-- Bottom Right -->
  <circle cx="28" cy="68" r="8" fill="#1a1a1a"/> <!-- Bottom Left -->
  <circle cx="68" cy="28" r="8" fill="#1a1a1a"/> <!-- Top Right -->
</svg>
